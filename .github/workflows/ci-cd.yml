name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ghcr.io/${{ github.repository_owner }}

jobs:
  java:
    name: Java tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Run backend tests on Linux
        if: runner.os == 'Linux'
        run: gradle test --no-daemon
        shell: bash
      - name: Run backend tests on non-Linux
        if: runner.os != 'Linux'
        run: ./gradlew test --no-daemon
        shell: bash

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Typecheck
        run: npx tsc -p tsconfig.app.json --noEmit
      - name: Build frontend
        run: npm run build

  python:
    name: Python tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python-service/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest

  publish:
    name: Publish production images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [java, frontend, python]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: java-meta
        with:
          images: ${{ env.IMAGE_NAMESPACE }}/demo-java-api
          tags: type=sha,prefix=,format=long
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.java-meta.outputs.tags }}
          labels: ${{ steps.java-meta.outputs.labels }}
      - uses: docker/metadata-action@v5
        id: python-meta
        with:
          images: ${{ env.IMAGE_NAMESPACE }}/demo-python-api
          tags: type=sha,prefix=,format=long
      - uses: docker/build-push-action@v6
        with:
          context: ./python-service
          push: true
          tags: ${{ steps.python-meta.outputs.tags }}
          labels: ${{ steps.python-meta.outputs.labels }}
      - uses: docker/metadata-action@v5
        id: frontend-meta
        with:
          images: ${{ env.IMAGE_NAMESPACE }}/demo-frontend
          tags: type=sha,prefix=,format=long
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          build-args: |
            VITE_JAVA_API_URL=${{ vars.PUBLIC_JAVA_API_URL }}
            VITE_PYTHON_API_URL=${{ vars.PUBLIC_PYTHON_API_URL }}
            VITE_KEYCLOAK_URL=${{ vars.PUBLIC_KEYCLOAK_URL }}
            VITE_KEYCLOAK_REALM=${{ vars.KEYCLOAK_REALM }}
            VITE_KEYCLOAK_CLIENT_ID=${{ vars.KEYCLOAK_FRONTEND_CLIENT_ID }}

  deploy:
    name: Deploy to production VM
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VM_SSH_PORT || 22 }}
          script: |
            set -eu
            cd /opt/demo
            export IMAGE_NAMESPACE="${{ env.IMAGE_NAMESPACE }}"
            export IMAGE_TAG="${{ github.sha }}"
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io --username "${{ secrets.GHCR_USERNAME }}" --password-stdin
            docker compose --env-file .env.production -f docker-compose.production.yml pull
            docker compose --env-file .env.production -f docker-compose.production.yml up -d --remove-orphans
            docker image prune -f