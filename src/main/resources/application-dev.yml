spring:
  application:
    name: demo
  datasource:
    url: jdbc:h2:mem:demo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
  devtools:
    add-properties: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/movie_project_keycloak
  
logging:
  level:
    org.springframework: INFO

server:
  port: 8082

keycloak:
  server-url: http://localhost:8081
  realm: movie_project_keycloak
  admin-realm: master
  admin-client-id: admin-cli
  admin-username: admin
  admin-password: admin
